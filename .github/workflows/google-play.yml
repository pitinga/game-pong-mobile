name: AAB Google Play

on:
  push:
    branches: [main]
  # Validar AAB antes do merge, com chave descartável e sem distribuir binários.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android_bundle:
    name: Godot 4.7.2 · AAB único · Android 7+ / API 36 / ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Android 16 SDK e Build Tools
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0' 'cmdline-tools;latest' 'ndk;29.0.14206865'

      - name: Godot 4.7.2 e export templates
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Validar SHA-512 e versão do Godot
        run: bash .github/scripts/verify-godot.sh

      - name: Importar projeto e testar
        run: |
          godot --headless --path . --editor --import --quit
          (cd addons/GodotGooglePlayBilling && sha256sum -c SHA256SUMS)
          godot --headless --path . --script res://tests/test_pong.gd
          godot --headless --path . --script res://tests/test_p1_regressions.gd
          godot --headless --path . --script res://tests/test_ad_lifecycle.gd
          godot --headless --path . --script res://tests/test_aspect_matrix.gd
          godot --headless --path . --script res://tests/test_game_rules.gd
          godot --headless --path . --script res://tests/test_collision_timing.gd
          godot --headless --path . --script res://tests/test_sweep_geometry.gd
          godot --headless --path . --script res://tests/test_storage_recovery.gd
          godot --headless --path . --script res://tests/test_pro_billing.gd
          godot --headless --path . --script res://tests/test_pro_ad_safety.gd
          godot --headless --path . --script res://tests/test_ad_entitlement_preflight.gd

      - name: Configurar exportador Android
        shell: bash
        run: |
          settings_file=$(find "$HOME/.config/godot" -maxdepth 1 -type f -name 'editor_settings-4*.tres' -print -quit)
          test -n "$settings_file"
          printf '\nexport/android/android_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT" >> "$settings_file"
          printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME" >> "$settings_file"

      - name: Chave descartável para validar o AAB
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/pong-upload.jks" -storepass validation-only -keypass validation-only -alias playupload -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=Pong Validation,O=Pitinga,C=BR'

      - name: Validar AAB único com chave descartável (não publicar)
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/pong-upload.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: playupload
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: validation-only
        run: |
          mkdir -p build
          godot --headless --path . --install-android-build-template --export-release "Google Play" build/pong-mobile-release.aab
          test -s build/pong-mobile-release.aab
          jarsigner -verify build/pong-mobile-release.aab
          # Conferência do artefato final; não confundir AAB com APK instalado.
          unzip -p build/pong-mobile-release.aab base/manifest/AndroidManifest.xml | strings | grep -F 'com.android.vending.BILLING'
          unzip -p build/pong-mobile-release.aab base/manifest/AndroidManifest.xml | strings | grep -F 'org.godotengine.plugin.googleplaybilling.GodotGooglePlayBilling'
          unzip -p build/pong-mobile-release.aab 'base/dex/classes*.dex' | strings | grep -F 'org/godotengine/plugin/googleplaybilling/GodotGooglePlayBilling'

      # Por segurança, o workflow público não acessa chaves reais de publicação,
      # não cria artifacts e não disponibiliza AAB para download.
