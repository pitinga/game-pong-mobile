name: Testes e APK Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Godot 4.7.2 · Testes + APK Free e Pro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17 (compatibilidade com Godot Android)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Pacotes Android necessários
        run: sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'

      - name: Godot 4.7.2 e export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Importar projeto
        run: godot --headless --path . --editor --import --quit

      - name: Rodar testes
        run: |
          godot --headless --path . --script res://tests/test_pong.gd
          godot --headless --path . --script res://tests/test_p1_regressions.gd
          godot --headless --path . --script res://tests/test_ad_lifecycle.gd
          godot --headless --path . --script res://tests/test_aspect_matrix.gd
          godot --headless --path . --script res://tests/test_game_rules.gd
          godot --headless --path . --script res://tests/test_collision_timing.gd
          godot --headless --path . --script res://tests/test_sweep_geometry.gd
          godot --headless --path . --script res://tests/test_storage_recovery.gd

      - name: Configurar exportador Android do Godot
        shell: bash
        run: |
          settings_file=$(find "$HOME/.config/godot" -maxdepth 1 -type f -name 'editor_settings-4*.tres' -print -quit)
          test -n "$settings_file"
          printf '\nexport/android/android_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT" >> "$settings_file"
          printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME" >> "$settings_file"
          keytool -genkeypair -keystore "$RUNNER_TEMP/pong-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'

      - name: Gerar APKs de teste Free e Pro (ARM64)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/pong-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/pong-mobile-free-debug.apk
          godot --headless --path . --export-debug "Android Pro" build/pong-mobile-pro-debug.apk
          test -s build/pong-mobile-free-debug.apk
          test -s build/pong-mobile-pro-debug.apk

      - name: Verificar identidade e arquitetura dos dois APKs
        run: |
          aapt="$ANDROID_SDK_ROOT/build-tools/35.0.1/aapt"
          "$aapt" dump badging build/pong-mobile-free-debug.apk | grep -q "^package: name='com.pitinga.pongmobile' "
          "$aapt" dump badging build/pong-mobile-pro-debug.apk | grep -q "^package: name='com.pitinga.pongmobile.pro' "
          "$aapt" dump badging build/pong-mobile-free-debug.apk | grep -Fq "native-code: 'arm64-v8a'"
          "$aapt" dump badging build/pong-mobile-pro-debug.apk | grep -Fq "native-code: 'arm64-v8a'"

      - name: Publicar os dois APKs como artefatos
        uses: actions/upload-artifact@v6
        with:
          name: pong-mobile-android-free-e-pro-debug
          path: build/*-debug.apk
          if-no-files-found: error

