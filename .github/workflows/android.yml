name: Testes e APK Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Godot 4.7.2 · Testes + APK único
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Impedir distribuição pública de builds
        run: |
          if grep -REn 'uses: *actions/[u]pload-artifact@|secrets\.PLAY_UPLOAD_|gh release (create|upload)' .github/workflows; then
            echo '::error::Workflows públicos não podem publicar builds ou usar chaves de assinatura de produção.'
            exit 1
          fi

      - name: Java 17 (compatibilidade com Godot Android)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Pacotes Android necessários
        run: sdkmanager 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36' 'cmdline-tools;latest'

      - name: Godot 4.7.2 e export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Importar projeto
        run: godot --headless --path . --editor --import --quit

      - name: Verificar integridade do plugin oficial de cobrança
        run: (cd addons/GodotGooglePlayBilling && sha256sum -c SHA256SUMS)

      - name: Rodar testes
        run: |
          godot --headless --path . --script res://tests/test_pong.gd
          godot --headless --path . --script res://tests/test_p1_regressions.gd
          godot --headless --path . --script res://tests/test_ad_lifecycle.gd
          godot --headless --path . --script res://tests/test_aspect_matrix.gd
          godot --headless --path . --script res://tests/test_game_rules.gd
          godot --headless --path . --script res://tests/test_collision_timing.gd
          godot --headless --path . --script res://tests/test_sweep_geometry.gd
          godot --headless --path . --script res://tests/test_storage_recovery.gd
          godot --headless --path . --script res://tests/test_pro_billing.gd
          godot --headless --path . --script res://tests/test_pro_ad_safety.gd
          godot --headless --path . --script res://tests/test_ad_entitlement_preflight.gd

      - name: Configurar exportador Android do Godot
        shell: bash
        run: |
          settings_file=$(find "$HOME/.config/godot" -maxdepth 1 -type f -name 'editor_settings-4*.tres' -print -quit)
          test -n "$settings_file"
          printf '\nexport/android/android_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT" >> "$settings_file"
          printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME" >> "$settings_file"
          keytool -genkeypair -keystore "$RUNNER_TEMP/pong-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'

      - name: Gerar APK único de teste (ARM64)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/pong-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --install-android-build-template --export-debug Android build/pong-mobile-debug.apk
          test -s build/pong-mobile-debug.apk

      - name: Verificar identidade e arquitetura do APK único
        run: |
          aapt="$ANDROID_SDK_ROOT/build-tools/36.1.0/aapt"
          "$aapt" dump badging build/pong-mobile-debug.apk | grep -q "^package: name='com.pitinga.pongmobile' "
          "$aapt" dump badging build/pong-mobile-debug.apk | grep -Fq "native-code: 'arm64-v8a'"
          # A compilação bem-sucedida, sozinha, não prova inclusão do Billing.
          "$aapt" dump permissions build/pong-mobile-debug.apk | grep -F 'com.android.vending.BILLING'
          "$aapt" dump xmltree build/pong-mobile-debug.apk AndroidManifest.xml | grep -F 'org.godotengine.plugin.googleplaybilling.GodotGooglePlayBilling'
          unzip -p build/pong-mobile-debug.apk 'classes*.dex' | strings | grep -F 'org/godotengine/plugin/googleplaybilling/GodotGooglePlayBilling'

      # Repo público: os APKs só existem no runner efêmero.
      # Nunca publicar APKs em artifacts, releases ou caches públicos.

